owner: morgan254917
repo: bidbell-status
user-agent: BidBell-Availability-Monitor
sites:
  - name: BidBell website
    url: https://getbidbell.com/
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: BidBell
    maxResponseTime: 20000
  - name: Trial signup
    url: https://getbidbell.com/start/
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: BidBell
    maxResponseTime: 20000
  - name: Cleaning opportunities
    url: https://getbidbell.com/cleaning-bids/
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: BidBell
    maxResponseTime: 20000
  - name: Workspace sign-in
    url: https://bidbell-workspace.onrender.com/app
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: BidBell
    maxResponseTime: 20000
  - name: Application health
    url: https://bidbell-workspace.onrender.com/api/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    maxResponseTime: 20000
assignees: [morgan254917]
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipPoweredByReadme: true
skipWorkflowUpdate: true
status-website:
  baseUrl: /bidbell-status
  name: BidBell status
  logoUrl: https://getbidbell.com/brand-icon.png
  introTitle: '**BidBell service availability**'
  introMessage: Scheduled public-service checks. History starts when monitoring is enabled. These checks do not verify email delivery, AI output or completed payments.
  navbar:
    - title: BidBell
      href: https://getbidbell.com/
    - title: Incidents
      href: https://github.com/morgan254917/bidbell-status/issues
