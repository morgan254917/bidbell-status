name: BidBell independent availability
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: bidbell-public-availability
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check public endpoints and record incidents
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
      - name: Update status summary
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc
        with:
          command: summary
        env:
          GH_PAT: ${{ github.token }}
